name: Publish apiindonesia CLI (manual)
# Temporary helper: publishes the API Indonesia CLI (khmuhtadin/api-indonesia-cli)
# to npm using this repo's NPM_TOKEN. Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref of khmuhtadin/api-indonesia-cli to publish
        required: true
        default: main
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: khmuhtadin/api-indonesia-cli
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm pack --dry-run
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
